<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>需要密码 - 记忆时光</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .locked-section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .locked-card { background: rgba(20,20,30,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(212,175,55,0.25); border-radius: 20px; padding: 3rem 2.5rem; text-align: center; max-width: 420px; width: 100%; animation: fadeInUp 0.6s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .locked-icon { font-size: 3.5rem; margin-bottom: 1rem; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
        .locked-title { font-family: 'Noto Serif SC', serif; font-size: 1.8rem; color: #d4af37; margin-bottom: 0.75rem; font-weight: 700; }
        .locked-desc { color: rgba(200,200,210,0.8); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6; }
        .flash-messages { margin-bottom: 1.5rem; }
        .flash { padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.9rem; }
        .flash-error { background: rgba(220,53,69,0.2); color: #f8717f; border: 1px solid rgba(220,53,69,0.3); }
        .flash-success { background: rgba(40,167,69,0.2); color: #5cdb6e; border: 1px solid rgba(40,167,69,0.3); }
        .locked-form { margin-bottom: 1.5rem; }
        .locked-input-wrap { display: flex; gap: 0; border: 1px solid rgba(212,175,55,0.4); border-radius: 12px; overflow: hidden; transition: border-color 0.3s; }
        .locked-input-wrap:focus-within { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
        .locked-input { flex: 1; background: rgba(0,0,0,0.3); border: none; padding: 0.9rem 1.2rem; color: #e0e0e0; font-size: 1rem; outline: none; font-family: 'Noto Sans SC', sans-serif; }
        .locked-input::placeholder { color: rgba(180,180,190,0.5); }
        .locked-submit { background: linear-gradient(135deg,#d4af37,#b8941f); border: none; padding: 0.9rem 1.4rem; color: #1a1a2e; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .locked-submit:hover { background: linear-gradient(135deg,#e6c84d,#c9a227); }
        .locked-back { display: inline-block; color: rgba(200,200,210,0.6); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .locked-back:hover { color: #d4af37; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">✦</span>
                <span class="brand-text">记忆时光</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">首页</a>
                <a href="/login" class="nav-link nav-link-login">管理员</a>
            </div>
            <button class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <section class="locked-section">
            <div class="locked-card">
                <div class="locked-icon">🔒</div>
                <h1 class="locked-title">{{ category.name }}</h1>
                <p class="locked-desc">此分类已设置访问密码，请输入密码查看内容</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('category_unlock', slug=category.slug) }}" class="locked-form">
                    <div class="locked-input-wrap">
                        <input type="password" name="password" class="locked-input"
                               placeholder="请输入访问密码" required autofocus>
                        <button type="submit" class="locked-submit">→</button>
                    </div>
                </form>

                <a href="/" class="locked-back">← 返回记忆长廊</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-quote">岁月如歌 · 记忆如诗</div>
            <div class="footer-copy">&copy; 2026 记忆时光</div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
